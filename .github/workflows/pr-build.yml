name: PR build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (not moving tags) to guard against
      # an upstream tag being repointed at a malicious commit. Trailing
      # comments are the human-readable version that SHA corresponded to
      # at pin time. .github/dependabot.yml opens grouped weekly PRs to
      # bump them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Build via build.sh
        run: bash ./build.sh

      - name: Verify zip was produced
        run: test -f cashu-for-woocommerce.zip

      - name: Run PHPUnit (with coverage)
        run: composer test:coverage

      - name: Run vitest (with coverage)
        run: npm run test:ts:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/php/clover.xml,coverage/ts/lcov.info
